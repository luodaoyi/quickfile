<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111017">
  <title>Quickfile</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header><a class="wordmark" href="/">Quickfile<span aria-hidden="true">.</span></a><button id="language" class="quiet" type="button">English</button></header>
  <main>
    <section id="send-view">
      <h1 data-i18n="title">文件，随手分享。</h1>
      <p class="intro" data-i18n="intro">拖入文件，复制链接。对方立即开始接收。</p>
      <button id="dropzone" type="button" class="dropzone">
        <span class="upload-icon" aria-hidden="true">＋</span>
        <strong data-i18n="drop">把文件拖到这里</strong>
        <span data-i18n="browse">或点击选择文件</span>
        <small data-i18n="limit">支持多文件 · 单文件最大 10 GiB</small>
      </button>
      <input id="files" type="file" multiple hidden>
      <details class="settings"><summary data-i18n="settings">分享设置</summary>
        <div class="setting-fields">
          <label><span data-i18n="expiry">保留时间</span><select id="hours"><option value="1" data-i18n="hour1">60 分钟</option><option value="2" data-i18n="hour2">2 小时</option><option value="6" data-i18n="hour6">6 小时</option><option value="12" data-i18n="hour12">12 小时</option><option value="24" selected data-i18n="hour24">24 小时</option></select></label>
          <label><span data-i18n="claims">最多领取</span><select id="claims"><option>1</option><option>5</option><option>10</option><option>20</option><option>50</option><option selected>100</option></select></label>
        </div>
      </details>
      <section id="current" hidden></section>
      <section class="recent"><h2 data-i18n="recent">最近的空间</h2><p id="empty-history" class="muted" data-i18n="empty">分享过的文件会显示在这里。</p><div id="history"></div></section>
    </section>
    <section id="receive-view" hidden><h1 data-i18n="receive">文件已为你准备好。</h1><p id="receive-info" class="intro"></p><div id="receive-files"></div><button id="download-all" class="primary" type="button" data-i18n="downloadAll">下载全部</button><p id="download-status" role="status" aria-live="polite"></p><progress id="download-progress" max="1" value="0" hidden></progress><button id="cancel-download" class="quiet" type="button" hidden data-i18n="cancel">取消下载</button></section>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
