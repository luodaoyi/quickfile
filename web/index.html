<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a202c" />
    <title>Quickfile</title>
    <link rel="icon" href="/mark.png" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/qrcodegen.js" defer></script>
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <div class="galaxy-background" aria-hidden="true">
      <canvas id="galaxy"></canvas>
    </div>
    <header class="page-header">
      <a class="wordmark" href="/"
        ><img src="/mark.png" width="40" height="40" alt="" />
        <h1>Quickfile</h1></a
      >
      <button
        id="send-more"
        class="primary"
        type="button"
        data-i18n="sendMore"
        hidden
      >
        发送更多文件
      </button>
    </header>
    <main>
      <section id="send-view" class="panel send-panel">
        <div class="upload-column">
          <div id="dropzone" class="dropzone">
            <div class="upload-center">
              <button
                id="choose-files"
                type="button"
                class="primary large"
                data-i18n="pickFiles"
                aria-expanded="false"
                aria-controls="file-menu"
              >
                选择要发送的文件
              </button>
              <div id="file-menu" class="file-menu" hidden>
                <button id="pick-files" type="button">
                  <span data-i18n="selectFiles">选择文件</span>
                </button>
                <button id="pick-folder" type="button">
                  <span data-i18n="selectFolder">选择文件夹</span>
                </button>
              </div>
              <p data-i18n="dropHelp">或者将文件拖到这里</p>
            </div>
            <p class="upload-limit" data-i18n="uploadLimit">
              文件最大可达 10 GiB
            </p>
            <button
              id="settings-open"
              class="settings-toggle icon-button"
              type="button"
              aria-label="分享设置"
              title="分享设置"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                aria-hidden="true"
              >
                <path d="M4 7h16M4 17h16M8 4v6m8 4v6" />
              </svg>
            </button>
          </div>
          <input id="files" type="file" multiple hidden />
          <input id="folder" type="file" webkitdirectory multiple hidden />
        </div>
        <section class="recent" aria-label="最近的空间">
          <div id="empty-history" class="empty-state">
            <h2 data-i18n="emptyTitle">简单、私密的文件共享</h2>
            <p data-i18n="emptyIntro">
              拖入文件即可分享链接，对方无需等待上传完成。文件在 24 小时或 100
              次领取后自动删除。
            </p>
          </div>
          <div id="history"></div>
        </section>
      </section>
      <section
        id="share-view"
        class="panel share-panel"
        aria-labelledby="share-title"
        hidden
      >
        <h2 id="share-title" tabindex="-1" data-i18n="filesReady">
          文件已准备就绪！
        </h2>
        <div class="share-link-area">
          <h3 data-i18n="copyToShare">复制链接以分享文件</h3>
          <div class="share-link-row">
            <input id="share-link" type="text" readonly aria-label="分享链接" />
            <button id="copy-link" type="button" class="primary large">
              <span data-i18n="copy">复制链接</span>
            </button>
          </div>
          <div class="share-tools">
            <button id="native-share" class="secondary" type="button" hidden>
              <span data-i18n="share">分享</span>
            </button>
            <button id="show-qr" class="secondary" type="button">
              <span data-i18n="showQR">展示二维码</span>
            </button>
          </div>
        </div>
        <p id="share-expiry"></p>
        <div class="upload-state" aria-live="polite">
          <p id="upload-status"></p>
          <progress id="upload-progress" max="1" value="0"></progress>
          <p id="upload-help"></p>
          <button
            id="resume-upload"
            type="button"
            class="secondary"
            data-i18n="resume"
            hidden
          >
            继续上传
          </button>
        </div>
      </section>
      <section id="receive-view" class="panel receive-panel" hidden>
        <div class="receive-list">
          <p id="receive-info" class="intro"></p>
          <div id="receive-files"></div>
        </div>
        <div class="receive-actions">
          <h2 data-i18n="receive">文件已为你准备好。</h2>
          <button
            id="download-all"
            class="primary large"
            type="button"
            data-i18n="downloadAll"
          >
            下载全部
          </button>
          <p id="download-status" role="status" aria-live="polite"></p>
          <progress id="download-progress" max="1" value="0" hidden></progress
          ><button
            id="cancel-download"
            class="secondary"
            type="button"
            hidden
            data-i18n="cancel"
          >
            取消下载
          </button>
        </div>
      </section>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <footer class="page-footer">
      <button id="language" class="primary language-button" type="button">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <ellipse cx="12" cy="12" rx="4" ry="10" />
          <path d="M2 12h20" /></svg
        ><span>简体中文</span>
      </button>
    </footer>
    <dialog id="qr-dialog" class="settings-dialog">
      <h2 data-i18n="scanToDownload">扫码下载</h2>
      <div id="qr-code"></div>
      <form method="dialog" class="dialog-actions">
        <button class="primary" type="submit" data-i18n="done">完成</button>
      </form>
    </dialog>
    <dialog id="share-settings" class="settings-dialog">
      <form method="dialog">
        <h2 data-i18n="settings">分享设置</h2>
        <div class="setting-fields">
          <label
            ><span data-i18n="expiry">保留时间</span
            ><select id="hours">
              <option value="1" data-i18n="hour1">60 分钟</option>
              <option value="2" data-i18n="hour2">2 小时</option>
              <option value="6" data-i18n="hour6">6 小时</option>
              <option value="12" data-i18n="hour12">12 小时</option>
              <option value="24" selected data-i18n="hour24">24 小时</option>
            </select></label
          >
          <label
            ><span data-i18n="claims">最多领取</span
            ><select id="claims">
              <option>1</option>
              <option>5</option>
              <option>10</option>
              <option>20</option>
              <option>50</option>
              <option selected>100</option>
            </select></label
          >
        </div>
        <div class="dialog-actions">
          <button class="primary" type="submit" data-i18n="done">完成</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
